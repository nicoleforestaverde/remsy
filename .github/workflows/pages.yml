# Static site — no Jekyll. Publishes the repo root as GitHub Pages.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish tree
        run: |
          mkdir _site
          # Copy the static site only — skip git metadata and this workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '_site' \
            ! -name '.git' \
            ! -name '.github' \
            -exec cp -a {} _site/ \;
          # Ensure Jekyll never rewrites paths if anyone flips back to branch deploy.
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
